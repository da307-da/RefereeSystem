{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Referee System{% endblock %}</title>
    <!-- Add Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" type = "text/css" href="{% static 'css/styles.css' %}">



    <style>
        nav {
            margin-bottom: 20px;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
        }

    </style>
</head>
<body>
    <nav>
        <a href="{% url 'accounts:home' %}">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:home' %}">Dashboard</a>
        {% else %}
            <a href="{% url 'accounts:register_referee' %}">Register as Referee</a>
            <a href="{% url 'accounts:register_ex_referee' %}">Register as Ex-Referee</a>  <!-- Added link -->
            <a href="{% url 'accounts:register_user' %}">Register as User</a>
            <a href="{% url 'accounts:login' %}">Login</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
